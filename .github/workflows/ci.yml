name: CI

on:
  push:
    branches:
      - main
      - 'phase/**'
      - 'feature/**'
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Workspace Verification (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: syncpod
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:password@localhost:5432/syncpod
      NEXT_TELEMETRY_DISABLED: '1'
      NO_COLOR: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js (.nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Test Suite Integrity Gate (no-skip, no-only, no-xit)
        run: |
          if grep -rnE "\.(skip|only)\(|xit\(|xdescribe\(" apps/*/test packages/*/test; then
            echo "FATAL: Found skipped or filtered test calls in test suites"
            exit 1
          fi
          echo "PASS: Zero skipped or filtered tests found."

      - name: Generate Prisma Client
        run: pnpm --filter @syncpod/db db:generate

      - name: Workspace Typecheck
        run: pnpm -r typecheck

      - name: Workspace Lint
        run: pnpm -r lint

      - name: Setup Database & Run Migrations
        run: |
          docker exec ${{ job.services.postgres.id }} psql -U postgres -d syncpod -c "CREATE DATABASE syncpod_test;" || true
          pnpm db:migrate
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/syncpod

      - name: Workspace Test
        run: pnpm -r test

      - name: Workspace Build
        run: pnpm -r build

      - name: Prototype Build Gate (D30)
        run: pnpm build:prototype
        env:
          NEXT_PUBLIC_REALTIME_MODE: fake
